<!-- @dsCard group="Slides" viewport="1280x720" name="Cover Slide" subtitle="Portada institucional — fondo azul · logo blanco · sello FECU · tricolor footer" -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1280px; height: 720px; overflow: hidden; font-family: var(--font-primary); }
    .slide {
      width: 1280px; height: 720px;
      background: linear-gradient(160deg, #7A80A3 0%, #6B7195 60%, #5E6583 100%);
      display: flex; flex-direction: column;
      position: relative;
    }
    .fecu {
      position: absolute; top: 32px; left: 44px;
      width: 88px; height: 88px;
      opacity: 0.9;
    }
    .center {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 28px;
      padding: 0 80px 16px;
    }
    .logo { width: 380px; height: auto; display: block; }
    .tagline {
      color: rgba(255,255,255,0.75);
      font-size: 24px;
      font-weight: 400;
      line-height: 1.45;
      text-align: center;
      letter-spacing: 0.01em;
    }
    .footer { display: flex; height: 12px; flex: none; }
    .footer-bar { flex: 1; }
  </style>
</head>
<body>
  <div class="slide">
    <img class="fecu" src="../assets/brand/fecu-social.png" alt="Sello FECU Social">
    <div class="center">
      <img class="logo" src="../assets/brand/logo-blanco-v2.svg" alt="huellalocal®">
      <p class="tagline">Por el desarrollo equitativo<br>de los territorios</p>
    </div>
    <div class="footer">
      <div class="footer-bar" style="background:#8DC899;"></div>
      <div class="footer-bar" style="background:#FECC52;"></div>
      <div class="footer-bar" style="background:#7A80A3;"></div>
    </div>
  </div>
</body>
</html>
