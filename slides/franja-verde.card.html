<!-- @dsCard group="Slides" viewport="1280x720" name="Contraportada" subtitle="Cierre institucional — fondo verde · logo blanco · redes · tricolor footer" -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1280px; height: 720px; overflow: hidden; font-family: var(--font-primary); }
    .slide {
      width: 1280px; height: 720px;
      background: linear-gradient(160deg, #8DC899 0%, #7BA884 50%, #78AA6D 100%);
      display: flex; flex-direction: column;
    }
    .center {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 36px;
    }
    .logo { width: 360px; height: auto; display: block; }
    .social-row {
      display: flex; flex-direction: column;
      align-items: center; gap: 12px;
    }
    .icons {
      display: flex; gap: 14px; align-items: center;
    }
    .icon-circle {
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,0.25);
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 20px;
    }
    .web {
      color: rgba(255,255,255,0.9);
      font-size: 22px; font-weight: 400;
      letter-spacing: 0.01em;
    }
    .footer { display: flex; height: 12px; flex: none; }
    .footer-bar { flex: 1; }
  </style>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0&display=block">
</head>
<body>
  <div class="slide">
    <div class="center">
      <img class="logo" src="../assets/brand/logo-blanco-v2.svg" alt="huellalocal®">
      <div class="social-row">
        <div class="icons">
          <!-- Instagram -->
          <div class="icon-circle">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="white"><rect x="2" y="2" width="20" height="20" rx="5" ry="5" stroke="white" stroke-width="2" fill="none"/><circle cx="12" cy="12" r="5" stroke="white" stroke-width="2" fill="none"/><circle cx="17.5" cy="6.5" r="1.5" fill="white"/></svg>
          </div>
          <!-- X/Twitter -->
          <div class="icon-circle">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          </div>
          <!-- Facebook -->
          <div class="icon-circle">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          </div>
          <!-- LinkedIn -->
          <div class="icon-circle">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
          </div>
        </div>
        <div class="web">www.huellalocal.cl</div>
      </div>
    </div>
    <div class="footer">
      <div class="footer-bar" style="background:#4D4E56;"></div>
      <div class="footer-bar" style="background:#FECC52;"></div>
      <div class="footer-bar" style="background:#8DC899; opacity:0.6;"></div>
    </div>
  </div>
</body>
</html>
