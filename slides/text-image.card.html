<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1280px; height: 720px; overflow: hidden;
      font-family: var(--font-primary);
    }
    .slide {
      width: 1280px; height: 720px;
      display: flex;
      background: #ffffff;
    }

    /* Left section */
    .left {
      flex: 1;
      background: var(--hl-azul-500);
      display: flex; flex-direction: column;
      justify-content: center;
      padding: var(--slide-margin-y) var(--slide-margin-x);
    }

    .text {
      font-size: 48px; font-weight: 700; line-height: 1.25;
      color: #ffffff;
      max-width: 500px;
    }

    /* Right section */
    .right {
      flex: 1;
      background: #f5f5f5;
      display: flex; align-items: center; justify-content: center;
      padding: var(--slide-margin-y) var(--slide-margin-x);
    }

    .image-placeholder {
      width: 100%; height: 100%;
      background: #e8e8e8;
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      color: #999999;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="slide">

    <div class="left">
      <p class="text">Fortalecemos la capacidad técnica de gobiernos locales para formular e implementar proyectos de inversión pública sostenibles.</p>
    </div>

    <div class="right">
      <div class="image-placeholder">📊 Gráfico / Fotograma</div>
    </div>

  </div>
</body>
</html>
