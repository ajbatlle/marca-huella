<!-- @dsCard group="Type" viewport="700x420" name="Type Scale" subtitle="Full Montserrat scale — xs to 5xl" -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { margin: 0; padding: 18px 20px; background: var(--color-surface); font-family: var(--font-primary); }
    .row { display: flex; align-items: baseline; gap: 14px; border-bottom: 1px solid var(--color-border); padding: 6px 0; }
    .row:last-child { border-bottom: none; }
    .meta { font-size: 9px; font-weight: 700; color: var(--color-text-muted); width: 100px; flex: none; }
    .sample { font-weight: var(--font-bold); color: var(--color-text); line-height: 1; white-space: nowrap; overflow: hidden; }
  </style>
</head>
<body>
  <div class="row"><div class="meta">xs · 11.5px</div><div class="sample" style="font-size:var(--text-xs);">Montserrat Extra Small</div></div>
  <div class="row"><div class="meta">sm · 13px</div><div class="sample" style="font-size:var(--text-sm);">Montserrat Small</div></div>
  <div class="row"><div class="meta">base · 16px</div><div class="sample" style="font-size:var(--text-base);">Montserrat Base</div></div>
  <div class="row"><div class="meta">lg · 18px</div><div class="sample" style="font-size:var(--text-lg);">Montserrat Large</div></div>
  <div class="row"><div class="meta">xl · 21.6px</div><div class="sample" style="font-size:var(--text-xl);">Montserrat XL</div></div>
  <div class="row"><div class="meta">2xl · 26px</div><div class="sample" style="font-size:var(--text-2xl);">Montserrat 2XL</div></div>
  <div class="row"><div class="meta">3xl · 36px</div><div class="sample" style="font-size:var(--text-3xl);">Montserrat 3XL</div></div>
  <div class="row"><div class="meta">4xl · 48px</div><div class="sample" style="font-size:var(--text-4xl); color:var(--color-primary);">948.190</div></div>
  <div class="row"><div class="meta">5xl · 72px</div><div class="sample" style="font-size:var(--text-5xl); color:var(--color-accent); font-weight:var(--font-bold);">14x</div></div>
</body>
</html>
