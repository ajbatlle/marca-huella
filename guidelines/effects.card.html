<!-- @dsCard group="Spacing" viewport="700x180" name="Effects & Overlays" subtitle="Transitions · glass morphism · photo overlays" -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { margin: 0; padding: 18px 20px; background: var(--color-surface); font-family: var(--font-primary); }
    .grid { display: flex; gap: 12px; }
    .panel { flex: 1; border-radius: var(--radius-md); overflow: hidden; }
    .title { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--color-text-muted); margin-bottom: 8px; }
    .transitions { display: flex; flex-direction: column; gap: 6px; }
    .t { display: flex; justify-content: space-between; font-size: 10px; color: var(--color-text-muted); padding: 4px 8px; background: var(--color-surface-muted); border-radius: 4px; }
    .tname { font-weight: 700; color: var(--color-text); }
  </style>
</head>
<body>
  <div class="grid">
    <div>
      <div class="title">Photo overlay</div>
      <div style="width:140px; height:100px; border-radius:var(--radius-md); background:var(--hl-azul-700); position:relative; overflow:hidden;">
        <div style="position:absolute; inset:0; background:var(--color-overlay-photo);"></div>
        <div style="position:relative; z-index:1; padding:12px; color:white; font-size:11px; font-weight:700; line-height:1.3;">--color-overlay-photo<br>rgba(90,95,130,.6)</div>
      </div>
    </div>
    <div>
      <div class="title">Glass panel (hero)</div>
      <div style="width:140px; height:100px; border-radius:var(--radius-md); background:linear-gradient(135deg, var(--hl-azul-700), var(--hl-azul-600)); position:relative; overflow:hidden;">
        <div style="position:absolute; inset:12px; background:var(--glass-bg); backdrop-filter:var(--blur-md); border:1px solid var(--glass-border); border-radius:var(--radius-sm); padding:8px;">
          <div style="color:white; font-size:10px; line-height:1.4;">--glass-bg<br>rgba(255,255,255,.15)</div>
        </div>
      </div>
    </div>
    <div style="flex:1.2;">
      <div class="title">Transitions</div>
      <div class="transitions">
        <div class="t"><span class="tname">--transition-fast</span><span>0.15s ease</span></div>
        <div class="t"><span class="tname">--transition-base</span><span>0.25s ease</span></div>
        <div class="t"><span class="tname">--transition-slow</span><span>0.40s ease</span></div>
        <div class="t"><span class="tname">--blur-md</span><span>blur(10px)</span></div>
      </div>
    </div>
  </div>
</body>
</html>
