<!-- @dsCard group="Brand" viewport="700x320" name="Slide Design System" subtitle="Stripe · section label · franja verde — motif reference" -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { margin: 0; padding: 18px 20px; background: var(--color-surface-muted); font-family: var(--font-primary); }
    .title { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--color-text-muted); margin-bottom: 8px; }
    .elem { background: white; border-radius: var(--radius-md); border: 1px solid var(--color-border); margin-bottom: 10px; overflow: hidden; }
    .elem-inner { padding: 12px 16px; }
  </style>
</head>
<body>
  <!-- Azul stripe (top/bottom of all slides) -->
  <div class="title">1. Azul accent stripes — top & bottom of every slide</div>
  <div class="elem">
    <div style="height:8px; background:var(--hl-azul-500);"></div>
    <div class="elem-inner" style="color:var(--color-text-muted); font-size:11px;">Slide content area</div>
    <div style="height:8px; background:var(--hl-azul-500);"></div>
  </div>

  <!-- Franja Verde footer -->
  <div class="title">2. Franja Verde — slide footer / closing element</div>
  <div class="elem">
    <img src="../assets/brand/franja-verde.png" style="width:100%; display:block;" alt="Franja Verde">
  </div>
</body>
</html>
