<!-- @dsCard group="Colors" viewport="700x200" name="Brand Colors" subtitle="Azul · Naranja · Verde — with scale" -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { margin: 0; padding: 18px 20px; background: var(--color-surface); font-family: var(--font-primary); }
    .grid { display: flex; gap: 14px; }
    .col { flex: 1; }
    .main { height: 72px; border-radius: 8px 8px 0 0; }
    .scale { display: flex; gap: 3px; margin-top: 3px; }
    .scale div { flex: 1; height: 18px; border-radius: 3px; }
    .info { padding: 7px 0 0; }
    .name { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-text); }
    .hex  { font-size: 11px; color: var(--color-text-muted); margin-top: 1px; }
    .role { font-size: 10px; color: var(--color-text-muted); font-style: italic; margin-top: 1px; }
  </style>
</head>
<body>
  <div class="grid">
    <div class="col">
      <div class="main" style="background:var(--hl-azul-500);"></div>
      <div class="scale">
        <div style="background:var(--hl-azul-500); opacity:0.4;"></div>
        <div style="background:var(--hl-azul-500); opacity:0.6;"></div>
        <div style="background:var(--hl-azul-500); opacity:0.8;"></div>
        <div style="background:var(--hl-azul-500);"></div>
      </div>
      <div class="info">
        <div class="name">Azul</div>
        <div class="hex">#7A80A3</div>
        <div class="role">Primary · headings · stripes</div>
      </div>
    </div>
    <div class="col">
      <div class="main" style="background:var(--hl-naranja-500);"></div>
      <div class="scale">
        <div style="background:var(--hl-naranja-500); opacity:0.4;"></div>
        <div style="background:var(--hl-naranja-500); opacity:0.6;"></div>
        <div style="background:var(--hl-naranja-500); opacity:0.8;"></div>
        <div style="background:var(--hl-naranja-500);"></div>
      </div>
      <div class="info">
        <div class="name">Naranja</div>
        <div class="hex">#E28757</div>
        <div class="role">Accent · CTAs · highlights</div>
      </div>
    </div>
    <div class="col">
      <div class="main" style="background:var(--hl-verde-mint);"></div>
      <div class="scale">
        <div style="background:var(--hl-verde-mint); opacity:0.4;"></div>
        <div style="background:var(--hl-verde-mint); opacity:0.6;"></div>
        <div style="background:var(--hl-verde-moss);"></div>
        <div style="background:var(--hl-verde-moss); opacity:0.7;"></div>
      </div>
      <div class="info">
        <div class="name">Verde</div>
        <div class="hex">#8DC899</div>
        <div class="role">Logo · sustainability</div>
      </div>
    </div>
    <div class="col">
      <div class="main" style="background:var(--hl-gray-700);"></div>
      <div class="scale">
        <div style="background:var(--hl-gray-400);"></div>
        <div style="background:var(--hl-gray-500);"></div>
        <div style="background:var(--hl-gray-900);"></div>
        <div style="background:var(--hl-gray-900);opacity:0;"></div>
      </div>
      <div class="info">
        <div class="name">Gris Texto</div>
        <div class="hex">#4D4E56</div>
        <div class="role">Body text · headings</div>
      </div>
    </div>
    <div class="col">
      <div class="main" style="background:var(--hl-gray-50); border:1px solid var(--color-border);"></div>
      <div class="scale">
        <div style="background:var(--hl-gray-100); border:1px solid var(--color-border);"></div>
        <div style="background:var(--hl-gray-150); border:1px solid var(--color-border);"></div>
        <div style="background:var(--hl-gray-200); border:1px solid var(--color-border);"></div>
        <div style="background:var(--hl-gray-50);opacity:0;"></div>
      </div>
      <div class="info">
        <div class="name">Gris Fondo</div>
        <div class="hex">#F7F8F9</div>
        <div class="role">Page bg · surface-muted</div>
      </div>
    </div>
  </div>
</body>
</html>
