<!-- @dsCard group="Spacing" viewport="700x200" name="Radius & Shadows" subtitle="Border radius scale + elevation system" -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { margin: 0; padding: 18px 20px; background: var(--color-surface-muted); font-family: var(--font-primary); }
    .section-title { font-size: 9px; font-weight: 700; color: var(--color-text-muted); margin-bottom: 10px; }
    .row { display: flex; gap: 12px; margin-bottom: 16px; align-items: flex-end; }
    .rbox { background: var(--hl-azul-500); display: flex; align-items: center; justify-content: center; }
    .rlabel { font-size: 9px; color: var(--color-text-muted); margin-top: 4px; text-align: center; }
    .sbox { background: white; border: 1px solid var(--color-border); width: 100px; height: 48px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; }
    .slabel { font-size: 9px; color: var(--color-text-muted); margin-top: 4px; text-align: center; }
  </style>
</head>
<body>
  <div class="section-title">Radius</div>
  <div class="row">
    <div>
      <div class="rbox" style="width:36px; height:36px; border-radius:var(--radius-xs);"></div>
      <div class="rlabel">xs · 4px</div>
    </div>
    <div>
      <div class="rbox" style="width:36px; height:36px; border-radius:var(--radius-sm);"></div>
      <div class="rlabel">sm · 6px</div>
    </div>
    <div>
      <div class="rbox" style="width:36px; height:36px; border-radius:var(--radius-md);"></div>
      <div class="rlabel">md · 10px</div>
    </div>
    <div>
      <div class="rbox" style="width:36px; height:36px; border-radius:var(--radius-lg);"></div>
      <div class="rlabel">lg · 16px</div>
    </div>
    <div>
      <div class="rbox" style="width:36px; height:36px; border-radius:var(--radius-full);"></div>
      <div class="rlabel">full</div>
    </div>
  </div>
  <div class="section-title">Shadows</div>
  <div class="row" style="align-items:center;">
    <div>
      <div class="sbox" style="box-shadow:var(--shadow-xs);"><span style="font-size:9px; color:var(--color-text-muted);">shadow-xs</span></div>
    </div>
    <div>
      <div class="sbox" style="box-shadow:var(--shadow-sm);"><span style="font-size:9px; color:var(--color-text-muted);">shadow-sm</span></div>
    </div>
    <div>
      <div class="sbox" style="box-shadow:var(--shadow-md);"><span style="font-size:9px; color:var(--color-text-muted);">shadow-md</span></div>
    </div>
    <div>
      <div class="sbox" style="box-shadow:var(--shadow-azul);"><span style="font-size:9px; color:var(--color-primary);">shadow-azul</span></div>
    </div>
    <div>
      <div class="sbox" style="box-shadow:var(--shadow-naranja); border-color:var(--hl-naranja-300);"><span style="font-size:9px; color:var(--color-accent);">shadow-naranja</span></div>
    </div>
  </div>
</body>
</html>
