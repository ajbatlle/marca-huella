<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: var(--post-w); height: var(--post-h); overflow: hidden;
      font-family: var(--font-primary);
      background: var(--color-post-bg);
    }
    .post {
      width: var(--post-w); height: var(--post-h);
      display: flex; flex-direction: column;
      background: var(--color-post-bg);
    }
    .stripe-top    { flex: none; height: var(--post-stripe); background: var(--color-post-frame); }
    .stripe-bottom { flex: none; height: var(--post-stripe); background: var(--color-post-accent); }

    .header {
      flex: none;
      display: flex; align-items: center; justify-content: flex-end;
      padding: 32px var(--post-margin) 18px;
    }
    .logo { height: 60px; width: auto; display: block; }

    /* Title block — left aligned, orange highlight on first line */
    .title {
      flex: none;
      padding: 8px var(--post-margin) 26px;
    }
    .title h1 {
      font-size: 70px; line-height: 1.08; letter-spacing: -0.01em;
      font-weight: var(--font-regular);
      color: var(--hl-azul-500);
    }
    .hl {
      display: inline;
      font-weight: var(--font-bold);
      color: #ffffff;
      background: var(--color-post-accent);
      padding: 2px 16px;
      border-radius: var(--radius-xs);
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
      line-height: 1.35;
    }
    .title strong { font-weight: var(--font-bold); color: var(--hl-azul-500); }

    /* Stacked figures */
    .figures {
      flex: 1;
      display: flex; flex-direction: column; gap: var(--space-5);
      padding: 0 var(--post-margin) 32px;
    }
    .figure {
      flex: 1; position: relative;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--hl-gray-150);
      display: flex; align-items: center; justify-content: center;
    }
    .img-ph {
      color: var(--hl-gray-400);
      font-size: var(--text-base); font-weight: var(--font-semibold);

    }
    .tag {
      position: absolute; top: 20px; right: 20px;
      background: #ffffff;
      color: var(--hl-azul-500);
      font-size: 26px; font-weight: var(--font-bold);
      padding: 8px 22px;
      border-radius: var(--radius-sm);
    }
  </style>
</head>
<body>
  <div class="post">
    <div class="stripe-top"></div>

    <div class="header">
      <img class="logo" src="../assets/brand/logo-color-v2.svg" alt="Huella Local">
    </div>

    <div class="title">
      <h1><span class="hl">Recuperando espacios</span> para la niñez y la comunidad <strong>en Renca</strong></h1>
    </div>

    <div class="figures">
      <div class="figure">
        <span class="img-ph">Fotografía — estado inicial</span>
        <span class="tag">Antes</span>
      </div>
      <div class="figure">
        <span class="img-ph">Fotografía — obra terminada</span>
        <span class="tag">Después</span>
      </div>
    </div>

    <div class="stripe-bottom"></div>
  </div>
</body>
</html>
