<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: var(--post-w); height: var(--post-h); overflow: hidden;
      font-family: var(--font-primary);
      background: var(--color-post-bg);
    }
    .post {
      width: var(--post-w); height: var(--post-h);
      display: flex; flex-direction: column;
      background: var(--color-post-bg);
      position: relative;
    }

    /* Frame stripes */
    .stripe-top    { flex: none; height: var(--post-stripe); background: var(--color-post-frame); }
    .stripe-bottom { flex: none; height: var(--post-stripe); background: var(--color-post-accent); }

    /* Header — logo top right */
    .header {
      flex: none;
      display: flex; align-items: center; justify-content: flex-end;
      padding: 32px var(--post-margin) 28px;
    }
    .logo { height: 60px; width: auto; display: block; }

    /* Title band — full-bleed orange */
    .title-band {
      flex: none;
      background: var(--color-post-accent);
      padding: 12px var(--post-margin);
    }
    .title-band h1 {
      font-size: 74px; font-weight: var(--font-bold); line-height: 1.0;
      color: #ffffff; letter-spacing: -0.01em;
      text-align: center;
      white-space: nowrap;
    }

    /* Subtitle — slate, centered */
    .subtitle {
      flex: none;
      padding: 26px var(--post-margin) 30px;
      text-align: center;
    }
    .subtitle p {
      font-size: 52px; font-weight: var(--font-regular); line-height: 1.12;
      color: var(--hl-azul-500);
    }
    .subtitle strong { font-weight: var(--font-bold); }

    /* Image */
    .figure {
      flex: 1;
      margin: 0 var(--post-margin) 32px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: var(--hl-gray-150);
      display: flex; align-items: center; justify-content: center;
    }
    .img-ph {
      color: var(--hl-gray-400);
      font-size: var(--text-lg); font-weight: var(--font-semibold);

    }
  </style>
</head>
<body>
  <div class="post">
    <div class="stripe-top"></div>

    <div class="header">
      <img class="logo" src="../assets/brand/logo-color-v2.svg" alt="Huella Local">
    </div>

    <div class="title-band">
      <h1>Una nueva plaza</h1>
    </div>

    <div class="subtitle">
      <p>junto a la comunidad <strong>en Antuco</strong></p>
    </div>

    <div class="figure">
      <span class="img-ph">Imagen objetivo del proyecto</span>
    </div>

    <div class="stripe-bottom"></div>
  </div>
</body>
</html>
