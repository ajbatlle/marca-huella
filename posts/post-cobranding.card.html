<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: var(--post-w); height: var(--post-h); overflow: hidden;
      font-family: var(--font-primary);
      background: var(--color-post-frame);
    }
    .post {
      width: var(--post-w); height: var(--post-h);
      background: var(--color-post-frame);
      padding: 64px;
    }
    .card {
      width: 100%; height: 100%;
      background: #ffffff;
      border-radius: var(--radius-xl);
      display: flex; flex-direction: column; align-items: center;
      padding: 96px 72px;
    }

    .title {
      text-align: center;
      font-size: 76px; line-height: 1.08; letter-spacing: -0.01em;
      color: var(--hl-naranja-500);
      font-weight: var(--font-regular);
    }
    .title strong { font-weight: var(--font-bold); }

    .logos {
      flex: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 80px;
    }
    .row {
      display: flex; align-items: center; justify-content: center;
      gap: 90px;
    }
    .partner {
      width: 300px; height: 200px;
      border: 1px dashed var(--color-border-strong);
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 0 18px;
      color: var(--color-text-muted);
      font-size: var(--text-base); font-weight: var(--font-semibold);
    }
    .huella { height: 92px; width: auto; display: block; }
  </style>
</head>
<body>
  <div class="post">
    <div class="card">
      <div class="title">Energía que<br><strong>deja Huella</strong></div>

      <div class="logos">
        <div class="row">
          <div class="partner">Logo aliado<br>(Municipio)</div>
          <div class="partner">Logo aliado<br>(Empresa)</div>
        </div>
        <img class="huella" src="../assets/brand/logo-color-v2.svg" alt="Huella Local">
      </div>
    </div>
  </div>
</body>
</html>
