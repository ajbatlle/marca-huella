<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: var(--post-w); height: var(--post-h); overflow: hidden;
      font-family: var(--font-primary);
      background: var(--color-post-bg);
    }
    .post {
      width: var(--post-w); height: var(--post-h);
      display: flex; flex-direction: column;
      background: var(--color-post-bg);
    }
    .stripe-top    { flex: none; height: var(--post-stripe); background: var(--color-post-frame); }
    .stripe-bottom { flex: none; height: var(--post-stripe); background: var(--color-post-accent); }

    .header {
      flex: none;
      display: flex; align-items: center; justify-content: flex-end;
      padding: 32px var(--post-margin) 20px;
    }
    .logo { height: 60px; width: auto; display: block; }

    /* Framed photo */
    .figure {
      flex: 1;
      margin: 0 var(--post-margin);
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: var(--hl-gray-150);
      display: flex; align-items: center; justify-content: center;
    }
    .img-ph {
      color: var(--hl-gray-400);
      font-size: var(--text-lg); font-weight: var(--font-semibold);

    }

    /* Caption title under photo */
    .caption {
      flex: none;
      padding: 30px var(--post-margin) 32px;
    }
    .caption .line1 {
      font-size: 70px; font-weight: var(--font-regular); line-height: 1.04;
      color: var(--hl-naranja-500); letter-spacing: -0.01em;
    }
    .caption .line2 {
      display: inline-block;
      margin-top: 12px;
      font-size: 70px; font-weight: var(--font-bold); line-height: 1.2;
      color: #ffffff; letter-spacing: -0.01em;
      background: var(--color-post-frame);
      padding: 4px 20px;
      border-radius: var(--radius-xs);
    }
  </style>
</head>
<body>
  <div class="post">
    <div class="stripe-top"></div>

    <div class="header">
      <img class="logo" src="../assets/brand/logo-color-v2.svg" alt="Huella Local">
    </div>

    <div class="figure">
      <span class="img-ph">Fotografía del proyecto</span>
    </div>

    <div class="caption">
      <div class="line1">Cuatro nuevas canchas</div>
      <div class="line2">para Salamanca</div>
    </div>

    <div class="stripe-bottom"></div>
  </div>
</body>
</html>
