<!-- @dsCard group="Plantillas (sin texto)" viewport="1080x1350" name="Plantilla — Antes / Después" subtitle="Franjas · logo · zona de título · dos imágenes con etiquetas — sin texto" -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../../styles.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: var(--post-w); height: var(--post-h); overflow: hidden;
      font-family: var(--font-primary);
      background: var(--color-post-bg);
    }
    .post {
      width: var(--post-w); height: var(--post-h);
      display: flex; flex-direction: column;
      background: var(--color-post-bg);
    }
    .stripe-top    { flex: none; height: var(--post-stripe); background: var(--color-post-frame); }
    .stripe-bottom { flex: none; height: var(--post-stripe); background: var(--color-post-accent); }

    .header {
      flex: none;
      display: flex; align-items: center; justify-content: flex-end;
      padding: 32px var(--post-margin) 18px;
    }
    .logo { height: 60px; width: auto; display: block; }

    .title {
      flex: none;
      height: 176px;
    }

    .figures {
      flex: 1;
      display: flex; flex-direction: column; gap: var(--space-5);
      padding: 0 var(--post-margin) 32px;
    }
    .figure {
      flex: 1; position: relative;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--hl-gray-150);
    }
    .tag {
      position: absolute; top: 20px; right: 20px;
      background: #ffffff;
      color: var(--hl-azul-500);
      font-size: 26px; font-weight: var(--font-bold);
      padding: 8px 22px;
      border-radius: var(--radius-sm);
    }
  </style>
</head>
<body>
  <div class="post">
    <div class="stripe-top"></div>

    <div class="header">
      <img class="logo" src="../../assets/brand/logo-color-v2.svg" alt="Huella Local">
    </div>

    <div class="title"></div>

    <div class="figures">
      <div class="figure">
        <span class="tag">Antes</span>
      </div>
      <div class="figure">
        <span class="tag">Después</span>
      </div>
    </div>

    <div class="stripe-bottom"></div>
  </div>
</body>
</html>
