<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: var(--post-w); height: var(--post-h); overflow: hidden;
      font-family: var(--font-primary);
      background: var(--color-post-bg);
    }
    .post {
      width: var(--post-w); height: var(--post-h);
      display: flex; flex-direction: column;
      background: var(--color-post-bg);
    }
    .stripe-top    { flex: none; height: var(--post-stripe); background: var(--color-post-frame); }
    .stripe-bottom { flex: none; height: var(--post-stripe); background: var(--color-post-accent); }

    .header {
      flex: none;
      display: flex; align-items: center; justify-content: flex-end;
      padding: 32px var(--post-margin) 12px;
    }
    .logo { height: 60px; width: auto; display: block; }

    /* Heading with left rule */
    .heading {
      flex: none;
      display: flex; gap: 28px;
      padding: 14px var(--post-margin) 22px;
    }
    .rule { flex: none; width: 8px; border-radius: 4px; background: var(--color-post-frame); }
    .heading h1 {
      font-size: 86px; font-weight: var(--font-bold); line-height: 0.98;
      letter-spacing: -0.01em;
      color: var(--hl-azul-500);
    }
    .heading .accent { color: var(--hl-naranja-500); }

    /* Lead */
    .lead {
      flex: none;
      padding: 0 var(--post-margin) 30px;
    }
    .lead p {
      font-size: 32px; font-weight: var(--font-regular); line-height: 1.34;
      color: var(--hl-gray-700);
      text-wrap: pretty;
    }
    .lead strong { font-weight: var(--font-bold); color: var(--hl-naranja-500); }

    /* Photo */
    .figure {
      flex: 1;
      margin: 0 var(--post-margin) var(--space-6);
      border-radius: var(--radius-lg);
      overflow: hidden;
      background:
        linear-gradient(0deg, rgba(132,136,188,0.55), rgba(132,136,188,0.55)),
        var(--hl-gray-300);
      display: flex; align-items: center; justify-content: center;
    }
    .img-ph {
      color: #ffffff;
      font-size: var(--text-lg); font-weight: var(--font-semibold);

    }

    /* Source */
    .source {
      flex: none;
      padding: 0 var(--post-margin) 32px;
    }
    .source p {
      font-size: 24px; font-weight: var(--font-semibold);
      color: var(--hl-azul-500);
    }
  </style>
</head>
<body>
  <div class="post">
    <div class="stripe-top"></div>

    <div class="header">
      <img class="logo" src="../assets/brand/logo-color-v2.svg" alt="Huella Local">
    </div>

    <div class="heading">
      <div class="rule"></div>
      <h1>¡Feliz Día del <span class="accent">Medio Ambiente!</span></h1>
    </div>

    <div class="lead">
      <p>En Chile, las comunas rurales concentran el mayor <strong>déficit de áreas verdes por habitante*</strong>. En Huella Local trabajamos para revertir esa brecha.</p>
    </div>

    <div class="figure">
      <span class="img-ph">Fotografía de terreno</span>
    </div>

    <div class="source">
      <p>*Fuente: Ministerio de Vivienda y Urbanismo, Catastro de Áreas Verdes, 2025.</p>
    </div>

    <div class="stripe-bottom"></div>
  </div>
</body>
</html>
