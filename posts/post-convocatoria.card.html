<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: var(--post-w); height: var(--post-h); overflow: hidden;
      font-family: var(--font-primary);
      background: var(--color-post-bg);
    }
    .post {
      width: var(--post-w); height: var(--post-h);
      display: flex; flex-direction: column;
      background: var(--color-post-bg);
    }

    .header {
      flex: none;
      display: flex; align-items: center; justify-content: flex-end;
      padding: 56px var(--post-margin) 18px;
    }
    .logo { height: 60px; width: auto; display: block; }

    .body {
      flex: 1;
      display: flex; flex-direction: column;
      padding: 0 var(--post-margin);
    }

    .overline {
      font-size: 44px; font-weight: var(--font-semibold);
      color: var(--hl-naranja-500);
      margin-bottom: 18px;
    }

    /* Title — periwinkle highlight per line */
    .title {
      font-size: 78px; font-weight: var(--font-bold); line-height: 1.46;
      letter-spacing: -0.01em;
      margin-bottom: 28px;
    }
    .title .hl {
      color: #ffffff;
      background: var(--color-post-frame);
      padding: 4px 18px;
      border-radius: var(--radius-xs);
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    .subtitle {
      font-size: 46px; font-weight: var(--font-regular); line-height: 1.12;
      color: var(--hl-azul-500);
      margin-bottom: 22px;
    }

    .requisitos {
      font-size: 33px; font-weight: var(--font-bold); line-height: 1.4;
      color: var(--hl-azul-500);
      text-wrap: pretty;
    }

    /* Plazo pill bottom-left */
    .footer {
      flex: none;
      padding: 24px var(--post-margin) 56px;
    }
    .plazo {
      display: inline-block;
      background: var(--hl-naranja-500);
      color: #ffffff;
      font-size: 38px; font-weight: var(--font-regular);
      padding: 12px 26px;
      border-radius: var(--radius-sm);
    }
    .plazo strong { font-weight: var(--font-bold); }
  </style>
</head>
<body>
  <div class="post">
    <div class="header">
      <img class="logo" src="../assets/brand/logo-color-v2.svg" alt="Huella Local">
    </div>

    <div class="body">
      <div class="overline">Zona Centro · Santiago</div>
      <h1 class="title"><span class="hl">Buscamos Encargado/a de Control de Gestión Institucional</span></h1>
      <p class="subtitle">Con mínimo cinco años de experiencia</p>
      <p class="requisitos">Para profesionales de Ingeniería Civil Industrial, Ingeniería Civil, Ingeniería en Información y Control de Gestión o carrera afín</p>
    </div>

    <div class="footer">
      <span class="plazo">Postula hasta el <strong>28 de junio</strong></span>
    </div>
  </div>
</body>
</html>
